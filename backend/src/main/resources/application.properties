# =============================================================
# Smart Complaint Management System - Application Properties
# =============================================================

# Server
server.port=8080

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_complaint_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# AI Classification Configuration
# Supported providers: openai, gemini, fallback
ai.provider=${AI_PROVIDER:fallback}
ai.api.key=${AI_API_KEY:}
ai.api.url=${AI_API_URL:https://api.openai.com/v1/chat/completions}
ai.api.model=${AI_MODEL:gpt-3.5-turbo}
ai.api.timeout-seconds=${AI_TIMEOUT:10}

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,https://smart-complaint-management-system-f-ten.vercel.app,https://smart-complaint-management-system-frontend-1shf2oiy2.vercel.app}

# Logging
logging.level.com.smartcomplaint=INFO
logging.level.org.springframework.security=WARN
